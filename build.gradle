plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
sourceSets.main.resources {
    srcDir 'src/main/generated'
    exclude '**/.cache/**'
}
repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'enchantment_infusion', '--all', '--output', file('src/main/generated').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        enchantment_infusion { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.enchantment_infusion
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
// Viewer runtimes are local development conveniences, never bundled or required.
def recipeViewer = providers.gradleProperty('recipeViewer').getOrElse('emi')
if (!(recipeViewer in ['emi', 'jei', 'none', 'coexist'])) {
    throw new GradleException("recipeViewer must be emi, jei, none, or coexist")
}
dependencies {
    compileOnly "dev.emi:emi-neoforge:${project.emi_version}:api"
    if (recipeViewer in ['emi', 'coexist']) {
        localRuntime "dev.emi:emi-neoforge:${project.emi_version}"
    }
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    if (recipeViewer in ['jei', 'coexist']) {
        localRuntime "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    }
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories { mavenLocal() }
}
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }
