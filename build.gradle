import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.darkhax.curseforgegradle' version '1.3.33'
	id 'dev.architectury.loom' version '1.10.455'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
}

loom {
    forge { }
    runs {
        data {
            data()
            programArgs '--mod', 'enchantment_infusion', '--all', '--output', file('src/main/generated').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
}
sourceSets.main.resources.srcDir 'src/main/generated'

def recipeViewer = providers.gradleProperty("recipeViewer").getOrElse("emi")
if (!(recipeViewer in ["emi", "jei", "none", "coexist", "rei"])) {
    throw new GradleException("Unknown recipeViewer: ${recipeViewer}. Use emi, jei, none, coexist, or rei.")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	modCompileOnly "dev.emi:emi-forge:${project.emi_version}:api"
    if (recipeViewer in ["emi", "coexist"]) {
        modLocalRuntime "dev.emi:emi-forge:${project.emi_version}"
    }

    // The split JEI API is Mojmap; Loom Forge expects SRG dependencies. Compile against
    // the SRG release jar's API without putting the viewer on the runtime classpath.
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }
    if (recipeViewer in ["jei", "coexist"]) {
        modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }
    }

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${project.rei_version}"
    if (recipeViewer == "rei") {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}"
    }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}

// Forge 1.20.1 must launch on Java 17 even when Gradle itself runs on Java 21.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }

// Forge's data launch validates assetsDir, including on a clean checkout.
tasks.named('runData') {
    dependsOn tasks.named('downloadAssets')
}

// Datagen bookkeeping is neither a game resource nor a source artifact.
tasks.withType(Jar).configureEach { exclude '.cache/**' }

// CurseForge publishing, matching Spell Dimension Mod (requires Gradle to run on Java 25).
def tokenFile = rootProject.file('curseforge-token')
def changelogFile = rootProject.file('CHANGELOG.md')
def changelog = providers.provider {
    changelogFile.isFile() ? changelogFile.getText('UTF-8')
            : "Enchantment Infusion ${project.version} for Minecraft ${project.minecraft_version} (Forge)."
}
def releaseType = providers.gradleProperty('curseforge_release_type')
def cfProjectId = providers.gradleProperty('curseforge_project_id')
def releaseJar = tasks.named('remapJar').flatMap { it.archiveFile }
def cfGameVersions = [project.minecraft_version, 'Forge', 'Client', 'Server']
def cfRequirements = []

def validateRelease = {
    if (!(releaseType.get() in ['alpha', 'beta', 'release'])) {
        throw new GradleException('curseforge_release_type must be alpha, beta or release.')
    }
    if (changelog.get().trim().isEmpty()) {
        throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
    }
}
def readToken = {
    if (!tokenFile.isFile()) {
        throw new GradleException('Create curseforge-token in the repository root and put your CurseForge upload token on one line.')
    }
    def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
    if (token.isEmpty() || token.contains('\n') || token.contains('\r')) {
        throw new GradleException('curseforge-token must contain one non-empty CurseForge upload token, without quotes or a property name.')
    }
    return token
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds and publishes the release JAR to CurseForge.'
    dependsOn tasks.named('build')
    notCompatibleWithConfigurationCache('CurseForgeGradle uses project state during publication.')
    apiToken = readToken
    disableVersionDetection()

    def artifact = upload(cfProjectId.get(), releaseJar)
    artifact.releaseType = releaseType
    artifact.changelog = changelog
    artifact.changelogType = 'markdown'
    cfGameVersions.each { artifact.addGameVersion(it) }
    cfRequirements.each { artifact.addRequirement(it) }
    doFirst {
        validateRelease()
        readToken()
    }
}

// Preview stays entirely local, using the same release inputs as publication.
tasks.register('previewCurseForge') {
    group = 'publishing'
    description = 'Builds the release JAR and previews CurseForge metadata without network calls or reading the token.'
    dependsOn tasks.named('build'), releaseJar
    notCompatibleWithConfigurationCache('Release metadata reads project state during execution.')
    doLast {
        validateRelease()
        def jarFile = releaseJar.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("The release JAR does not exist: ${jarFile}")
        }
        logger.lifecycle("CurseForge project: ${cfProjectId.get()}")
        logger.lifecycle("Release JAR: ${jarFile}")
        logger.lifecycle(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                changelog: changelog.get(),
                changelogType: 'markdown',
                releaseType: releaseType.get(),
                gameVersions: cfGameVersions,
                relations: [projects: cfRequirements.collect { [slug: it, type: 'requiredDependency'] }]
        ])))
    }
}
