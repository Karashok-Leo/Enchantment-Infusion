plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir 'src/main/generated'
    exclude '**/.cache/**'
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'enchantment_infusion', '--all', '--output', file('src/main/generated').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        enchantment_infusion { sourceSet sourceSets.main }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    compileOnly "dev.emi:emi-neoforge:${project.emi_version}:api"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"

    localRuntime "dev.emi:emi-neoforge:${project.emi_version}"
    localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
    localRuntime "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories { mavenLocal() }
}

tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }

def changelogText = providers.provider {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.isFile() || changelogFile.getText('UTF-8').trim().isEmpty()) {
        throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
    }
    changelogFile.getText('UTF-8')
}

def localToken = { String filename ->
    def tokenFile = rootProject.file(filename)
    providers.provider {
        if (!tokenFile.isFile()) {
            throw new GradleException("Create ${filename} in the repository root and put the upload token on one line.")
        }
        def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
        if (token.isEmpty() || token.contains('\n') || token.contains('\r')) {
            throw new GradleException("${filename} must contain one non-empty upload token, without quotes or a property name.")
        }
        token
    }
}

def publishDryRun = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'publishModsDryRun'
}

publishMods {
    file = jar.archiveFile
    displayName = file.map { it.asFile.name }
    changelog = changelogText
    type = STABLE
    modLoaders.add('neoforge')
    dryRun = publishDryRun

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = localToken('curseforge-token')
        minecraftVersions.add(project.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
    }
    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = localToken('modrinth-token')
        minecraftVersions.add(project.minecraft_version)
        environment = CLIENT_AND_SERVER
    }
}

tasks.register('publishModsDryRun') {
    group = 'publishing'
    description = 'Preview mod publishing without uploading.'
    dependsOn tasks.named('publishMods')
}
