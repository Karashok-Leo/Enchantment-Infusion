name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup Java 17 compilation toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: retain Java 17 toolchain location
        run: echo "JAVA_HOME_17_X64=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: setup Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and regenerate data
        run: |
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME runData
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/*
