plugins {
	id 'dev.architectury.loom' version '1.10.455'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
}

loom {
    forge { }
    runs {
        data {
            data()
            programArgs '--mod', 'enchantment_infusion', '--all', '--output', file('src/main/generated').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
}
sourceSets.main.resources.srcDir 'src/main/generated'
sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom.mods {
    enchantment_infusion {
        sourceSet sourceSets.main
        sourceSet sourceSets.validation
    }
}


def recipeViewer = providers.gradleProperty("recipeViewer").getOrElse("emi")
if (!(recipeViewer in ["emi", "jei", "none", "coexist", "rei"])) {
    throw new GradleException("Unknown recipeViewer: ${recipeViewer}. Use emi, jei, none, coexist, or rei.")
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	modCompileOnly "dev.emi:emi-forge:${project.emi_version}:api"
    if (recipeViewer in ["emi", "coexist"]) {
        modLocalRuntime "dev.emi:emi-forge:${project.emi_version}"
    }

    // The split JEI API is Mojmap; Loom Forge expects SRG dependencies. Compile against
    // the SRG release jar's API without putting the viewer on the runtime classpath.
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }
    if (recipeViewer in ["jei", "coexist"]) {
        modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }
    }

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${project.rei_version}"
    if (recipeViewer == "rei") {
        modLocalRuntime "me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}"
    }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}
test { useJUnitPlatform() }

// Forge 1.20.1 must launch on Java 17 even when Gradle itself runs on Java 21.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }

// Forge's data launch validates assetsDir, including on a clean checkout.
tasks.named('runData') {
    dependsOn tasks.named('downloadAssets'), tasks.named('validationClasses')
    systemProperty 'enchantment_infusion.validation.jei', recipeViewer == 'jei'
    def validationReport = layout.buildDirectory.file('reports/forge-validation.json')
    systemProperty 'enchantment_infusion.validation.report', validationReport.get().asFile.absolutePath
    doFirst { delete validationReport }
    doLast {
        def report = validationReport.get().asFile
        if (!report.exists() || new groovy.json.JsonSlurper().parse(report).passed != 10) {
            throw new GradleException('Forge runtime regression checks did not complete.')
        }
    }
}

// Datagen bookkeeping is neither a game resource nor a source artifact.
tasks.withType(Jar).configureEach { exclude '.cache/**' }
