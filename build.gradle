plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
}

fabricApi {
	configureDataGeneration()
}

def recipeViewer = providers.gradleProperty('recipeViewer').getOrElse('emi')
if (!(recipeViewer in ['emi', 'jei', 'none', 'coexist', 'rei'])) {
	throw new GradleException("Unknown recipeViewer '${recipeViewer}'; expected emi, jei, none, coexist or rei")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
	if (recipeViewer in ['emi', 'coexist']) {
		modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
	}

	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	if (recipeViewer in ['jei', 'coexist']) {
		// The distribution already bundles JEI modules; its POM also lists
		// Mojang-mapped modules that must not enter the Fabric runtime.
		modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
			transitive = false
		}
	}

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	if (recipeViewer == 'rei') {
		modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}