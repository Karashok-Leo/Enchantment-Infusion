plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'dev.architectury.loom' version '1.10.455'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

loom {
    forge {}
    runs {
        data {
            data()
            programArgs '--mod', 'enchantment_infusion', '--all', '--output', file('src/main/generated').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
}
sourceSets.main.resources.srcDir 'src/main/generated'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    modCompileOnly "dev.emi:emi-forge:${project.emi_version}:api"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${project.rei_version}"
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }

    modLocalRuntime "dev.emi:emi-forge:${project.emi_version}"
//    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}"
//    modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}

// Forge 1.20.1 must launch on Java 17 even when Gradle itself runs on Java 21.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }

// Forge's data launch validates assetsDir, including on a clean checkout.
tasks.named('runData') {
    dependsOn tasks.named('downloadAssets')
}

// Datagen bookkeeping is neither a game resource nor a source artifact.
tasks.withType(Jar).configureEach { exclude '.cache/**' }

def changelogText = providers.provider {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.isFile() || changelogFile.getText('UTF-8').trim().isEmpty()) {
        throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
    }
    changelogFile.getText('UTF-8')
}

def localToken = { String filename ->
    def tokenFile = rootProject.file(filename)
    providers.provider {
        if (!tokenFile.isFile()) {
            throw new GradleException("Create ${filename} in the repository root and put the upload token on one line.")
        }
        def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
        if (token.isEmpty() || token.contains('\n') || token.contains('\r')) {
            throw new GradleException("${filename} must contain one non-empty upload token, without quotes or a property name.")
        }
        token
    }
}

def publishDryRun = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'publishModsDryRun'
}

publishMods {
    file = jar.archiveFile
    displayName = file.map { it.asFile.name }
    changelog = changelogText
    type = STABLE
    modLoaders.add('fabric')
    dryRun = publishDryRun

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = localToken('curseforge-token')
        minecraftVersions.add(project.minecraft_version)
        requires('fabric-api')
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
    }
    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = localToken('modrinth-token')
        minecraftVersions.add(project.minecraft_version)
        requires('fabric-api')
        environment = CLIENT_AND_SERVER
    }
}

tasks.register('publishModsDryRun') {
    group = 'publishing'
    description = 'Preview mod publishing without uploading.'
    dependsOn tasks.named('publishMods')
}
